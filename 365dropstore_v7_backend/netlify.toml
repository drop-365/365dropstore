# 365 Drop Store — Netlify config
# Static site at root, serverless functions in netlify/functions.

[build]
  publish = "public"
  functions = "netlify/functions"

# No build step needed — the site is a single static HTML file.
# Functions are bundled automatically by Netlify.

[functions]
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────────────
#  Image CDN
#
#  Product photos live in a public Cloudflare R2 bucket at full size —
#  600x800 and up, around 96KB each on the wire but roughly 1.9MB each
#  once the browser decodes them into a bitmap it can draw.
#
#  The shop shows them as ~170px grid cards on a phone and 98px review
#  thumbnails. Decoding a dozen full-size photos to paint thumbnails is
#  what pushed Safari past its per-tab memory budget and made it reload
#  the page out from under the shopper mid-scroll.
#
#  Allowlisting the bucket here lets the storefront request
#  /.netlify/images?url=...&w=400, so Netlify re-encodes to the size we
#  actually draw and caches the result at the edge.
# ─────────────────────────────────────────────────────────────────────
[images]
  remote_images = [
    "https://pub-439f2b6b71214b70a749ab163b863494\\.r2\\.dev/.*"
  ]

# Edge Functions — product OG meta injection for social sharing & SEO
[[edge_functions]]
  path = "/p/*"
  function = "og-meta"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# Clean product URLs — serve index.html so the JS app handles /p/{id} routes
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

# Vault 001 was folded into the regular shop on 2026-11-24; send any old
# links or bookmarks home instead of a 404.
[[redirects]]
  from = "/vault/*"
  to = "/"
  status = 301
  force = true

# Fit landing pages for search — the JS app pre-filters the shop; the
# fit-landing edge function sets the title, description, canonical and h1.
[[redirects]]
  from = "/wide-leg-jeans"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/straight-jeans"
  to = "/index.html"
  status = 200

# Owner admin. The storefront page serves /admin/ and, only on this route,
# fetches /admin/panel.html, admin.css and admin.js — shoppers never download
# them. Not linked anywhere; kept out of search by the X-Robots-Tag below.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200

# Meta Shop checkout URL (Commerce Manager → Shop → Add checkout URL).
# Meta sends buyers to /checkout?products=<id>:<qty>,...  — the JS app reads it.
[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────
#  Bot traps
#
#  Automated scanners hammer every public site looking for an
#  exploitable WordPress install. We don't run WordPress, so there is
#  nothing for them to find — but each probe still costs bandwidth on
#  a credit-based plan, and this site has already been taken down once
#  by exhausting its monthly allotment.
#
#  410 Gone (not 404) tells a well-behaved crawler the path will never
#  exist, so it stops asking. These rules are matched at the edge before
#  anything else runs, so a probe costs almost nothing.
#
#  Keep these ABOVE the catch-all below.
# ─────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/410.html"
  status = 410
  force = true

# The scanner also walks common sub-folder guesses —
# /blog/wp-includes/..., /shop/wp-includes/..., /2020/wp-includes/...
# This one rule covers every prefix it tries.
[[redirects]]
  from = "/*/wp-includes/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/*/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/*/xmlrpc.php"
  to = "/410.html"
  status = 410
  force = true

# Other tools that get probed constantly and that we don't run
[[redirects]]
  from = "/.env"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/410.html"
  status = 410
  force = true

# ─────────────────────────────────────────────────────────────────────
#  Icons — these change almost never, so let browsers and the CDN hold
#  onto them for a year instead of re-requesting on every visit.
# ─────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin route and its files: never index.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
