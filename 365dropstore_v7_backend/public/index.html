<style>
.vault-door{background:#0E0E0C;border-top:1px solid #222;border-bottom:1px solid #222;margin:40px 0;position:relative;overflow:hidden}
.vault-door-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.2fr 0.8fr;min-height:440px;position:relative;z-index:1}
.vault-door-img{position:relative;overflow:hidden;min-height:440px;background:linear-gradient(135deg,#1a1a18,#2a2a26);display:flex;align-items:center;justify-content:center}
.vault-door-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.vault-door-scan{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(192,57,43,0.5);box-shadow:0 0 12px rgba(192,57,43,0.3);animation:vd-scan 3s linear infinite;pointer-events:none}
@keyframes vd-scan{0%{top:0}100%{top:100%}}
.vault-door-copy{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.vault-door-copy .vd-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A8783;text-transform:uppercase;letter-spacing:0.08em;line-height:2}
.vault-door-copy h2{font-family:'Instrument Serif',Georgia,serif;font-size:44px;color:#F6F3EE;line-height:0.92;letter-spacing:-0.04em}
.vault-door-copy h2 em{font-style:italic}
.vault-door-copy p{font-size:13px;color:#8A8783;line-height:1.7;max-width:360px}

/* Live countdown, inline, small */
.vault-door-cd{
  display:flex;gap:16px;margin:8px 0 4px;font-family:'JetBrains Mono',monospace;
}
.vd-cd-unit{display:flex;flex-direction:column;align-items:center}
.vd-cd-num{font-size:24px;font-weight:600;color:#F6F3EE;font-variant-numeric:tabular-nums}
.vd-cd-lbl{font-size:8px;color:#8A8783;letter-spacing:0.08em;margin-top:2px}

.vault-door-cta{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:transparent;color:#F6F3EE;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;text-decoration:none;width:fit-content;border:1px solid #C0392B;transition:background 0.3s}
.vault-door-cta:hover{background:rgba(192,57,43,0.1)}
@media(max-width:960px){
  .vault-door-inner{grid-template-columns:1fr}
  .vault-door-img{min-height:280px}
  .vault-door-copy{padding:28px 20px}
  .vault-door-copy h2{font-size:32px}
}
</style>

<section class="vault-door">
  <div class="vault-door-inner">
    <div class="vault-door-img">
      <!-- Replace with: <img src="YOUR_R2_URL/obsidian_denim_laser_grid.webp" alt="Vault Obsidian"> -->
      <div style="position:relative;z-index:2;font-family:monospace;font-size:10px;color:#555">OBSIDIAN DENIM — REPLACE WITH IMAGE</div>
      <div class="vault-door-scan"></div>
    </div>
    <div class="vault-door-copy">
      <div class="vd-tag">VAULT 000 — ATELIER EDITION<br>12 UNITS WORLDWIDE · DELHI STUDIO</div>
      <h2>Two forms.<br><em>Dropping tonight.</em></h2>
      <p>Okayama 18oz selvedge. Hand-forged in Delhi studio — not a warehouse. Numbered, NFC authenticated.</p>

      <div class="vault-door-cd" id="vd-countdown">
        <div class="vd-cd-unit"><div class="vd-cd-num" id="vd-h">00</div><div class="vd-cd-lbl">HRS</div></div>
        <div class="vd-cd-unit"><div class="vd-cd-num" id="vd-m">00</div><div class="vd-cd-lbl">MIN</div></div>
        <div class="vd-cd-unit"><div class="vd-cd-num" id="vd-s">00</div><div class="vd-cd-lbl">SEC</div></div>
      </div>

      <a href="/vault/" class="vault-door-cta">OPENS 9 PM →</a>
    </div>
  </div>
</section>

<script>
(function(){
  function getTarget(){
    const now = new Date();
    const t = new Date();
    t.setHours(21,0,0,0);
    if (t <= now) t.setDate(t.getDate()+1);
    return t;
  }
  const target = getTarget();
  function tick(){
    const diff = target - new Date();
    if (diff <= 0){
      document.getElementById('vd-h').textContent='00';
      document.getElementById('vd-m').textContent='00';
      document.getElementById('vd-s').textContent='00';
      return;
    }
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    document.getElementById('vd-h').textContent = String(h).padStart(2,'0');
    document.getElementById('vd-m').textContent = String(m).padStart(2,'0');
    document.getElementById('vd-s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
